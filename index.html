<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Elidrissi Laoukili</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            /* the iframe handles its own scrolling */
        }

        iframe {
            display: block;
            border: 0;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>

<body>
    <iframe id="site" src="https://elidrissilaoukili.netlify.app" title="Elidrissi Laoukili Portfolio"
        allow="clipboard-write; fullscreen"></iframe>

    <script>
        // Optional: listen for height messages from the Netlify page
        // (only needed if you want the iframe to resize instead of using 100vh + its own scroll)
        window.addEventListener('message', (event) => {
            if (event.origin !== 'https://elidrissilaoukili.netlify.app') return;
            if (event.data && event.data.type === 'resize') {
                document.getElementById('site').style.height = event.data.height + 'px';
            }
        });
    </script>
</body>
</html>
